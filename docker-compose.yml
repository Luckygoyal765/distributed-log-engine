version: '3.8'

networks:
  log-engine-net:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  log_index_data:

services:
  # --- ZOOKEEPER (Kafka Coordination) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - log-engine-net

  # --- APACHE KAFKA BROKER ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - log-engine-net

  # --- REDIS (Search Query Caching) ---
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - log-engine-net

  # --- NGINX EDGE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ingestion-gateway
    networks:
      - log-engine-net

  # --- INGESTION GATEWAY (Node.js) ---
  ingestion-gateway:
    build:
      context: ./ingestion-gateway
    container_name: ingestion-gateway
    environment:
      - PORT=3000
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=app-logs
    depends_on:
      - kafka
    networks:
      - log-engine-net

  # --- INDEXER WORKER (Python Stream Processor) ---
  indexer-worker:
    build:
      context: ./indexer-worker
    container_name: indexer-worker
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=app-logs
      - CONSUMER_GROUP=log-indexer-group
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    depends_on:
      - kafka
    networks:
      - log-engine-net

  # --- SEARCH API (Express.js) ---
  search-api:
    build:
      context: ./search-api
    container_name: search-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    networks:
      - log-engine-net